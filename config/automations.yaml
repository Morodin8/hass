- id: '1779870533510'
  alias: Nest - Outside becomes warmer than inside
  description: ''
  triggers:
  - trigger: template
    value_template: "{% set outside = state_attr('weather.huis', 'temperature') %}
      {% set inside = state_attr('climate.nest_thermometer', 'current_temperature')
      %} {{ outside is not none\n   and inside is not none\n   and inside | float
      > 25\n   and (outside | float - inside | float) >= 1 }}\n"
    for:
      minutes: 10
  actions:
  - action: notify.mobile_app_grays20
    data:
      message: '{% set outsideTemp = state_attr(''weather.huis'', ''temperature'')
        | float | round(1) %} {% set insideTemp = state_attr(''climate.nest_thermometer'',
        ''current_temperature'') | float | round(1) %} {% set diff = (outsideTemp
        - insideTemp) | round(1) %} Outside is warmer by {{ diff }}°C: {{ outsideTemp
        }}°C outside vs {{ insideTemp }}°C inside at {{ now().strftime(''%H:%M'')
        }}'
  mode: single
- id: '1779871124023'
  alias: Nest - Inside becomes warmer than outside
  description: ''
  triggers:
  - trigger: template
    value_template: "{% set outside = state_attr('weather.huis', 'temperature') %}
      {% set inside = state_attr('climate.nest_thermometer', 'current_temperature')
      %} {{ outside is not none\n   and inside is not none\n   and outside | float
      > 25\n   and (inside | float - outside | float) >= 1 }}\n"
    for:
      minutes: 10
  actions:
  - action: notify.mobile_app_grays20
    data:
      message: '{% set outsideTemp = state_attr(''weather.huis'', ''temperature'')
        | float | round(1) %} {% set insideTemp = state_attr(''climate.nest_thermometer'',
        ''current_temperature'') | float | round(1) %} {% set diff = (insideTemp -
        outsideTemp) | round(1) %} Inside is warmer by {{ diff }}°C: {{ insideTemp
        }}°C inside vs {{ outsideTemp }}°C outside at {{ now().strftime(''%H:%M'')
        }}'
  mode: single
- id: '1780152263272'
  alias: Nest - Window advice based on inside/outside temperature
  description: ''
  triggers:
  - trigger: template
    value_template: "{% set outside = state_attr('weather.huis', 'temperature') %}
      {% set inside = state_attr('climate.nest_thermometer', 'current_temperature')
      %} {{ outside is not none\n   and inside is not none\n   and inside | float
      >= 25\n   and (inside | float - outside | float) | abs >= 1 }}\n"
    for:
      minutes: 10
  actions:
  - variables:
      outsideTemp: '{{ state_attr(''weather.huis'', ''temperature'') | float | round(1)
        }}'
      insideTemp: '{{ state_attr(''climate.nest_thermometer'', ''current_temperature'')
        | float | round(1) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ insideTemp | float > outsideTemp | float }}'
      sequence:
      - action: notify.mobile_app_grays20
        data:
          message: 'Open windows: inside is warmer by {{ (insideTemp | float - outsideTemp
            | float) | round(1) }}°C (inside {{ insideTemp }}°C vs outside {{ outsideTemp
            }}°C) at {{ now().strftime(''%H:%M'') }}'
    - conditions:
      - condition: template
        value_template: '{{ outsideTemp | float > insideTemp | float }}'
      sequence:
      - action: notify.mobile_app_grays20
        data:
          message: 'Close windows: outside is warmer by {{ (outsideTemp | float -
            insideTemp | float) | round(1) }}°C (outside {{ outsideTemp }}°C vs inside
            {{ insideTemp }}°C) at {{ now().strftime(''%H:%M'') }}'
  mode: single
