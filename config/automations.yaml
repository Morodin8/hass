- id: '1697276238759'
  alias: Ring rang
  description: Doorbell rang - snapshot + record via ring-mqtt
  triggers:
  - entity_id: binary_sensor.front_door_ding_2
    to: 'on'
    trigger: state
  actions:
  - variables:
      ts: '{{ now().strftime(''%Y-%m-%dT%H-%M-%S'') }}'
      base: '{{ ts }}_D'
  - parallel:
    - sequence:
      - target:
          entity_id: automation.ring_motion
        data:
          stop_actions: true
        continue_on_error: true
        action: automation.turn_off
      - target:
          entity_id: switch.front_door_live_stream
        continue_on_error: true
        action: switch.turn_on
      - target:
          entity_id: camera.03cabcc9_ring_mqtt
        data:
          filename: /media/ring/{{ base }}.jpg
        continue_on_error: true
        action: camera.snapshot
      - delay:
          seconds: '{{ 1 if is_state(''sun.sun'', ''above_horizon'') else 2 }}

            '
      - target:
          entity_id: camera.03cabcc9_ring_mqtt
        data:
          filename: /media/ring/{{ base }}.mp4
          duration: 60
        continue_on_error: true
        action: camera.record
      - delay: 00:00:02
      - target:
          entity_id: switch.front_door_live_stream
        continue_on_error: true
        action: switch.turn_off
      - target:
          entity_id: automation.ring_motion
        continue_on_error: true
        action: automation.turn_on
    - sequence:
      - device_id: 0ce007b865643a89a067e35565dd1288
        domain: button
        entity_id: 21e2f302cb2f66424b298b75e4d44b41
        type: press
      - condition: state
        entity_id: binary_sensor.grays20_is_charging
        state: 'off'
      - data:
          volume_level: 0.5
        target:
          device_id:
          - 7ae32a5dcbfac2fe93dd53c825c314fb
          - 9fd7a1f708b2967fe80721f3bfca723b
          - 70245677b4f5bec1dc95918e721f61bf
          - e6e163d5a869e9e944b547586507c7d0
          - fba5f93d82666866053fc428d6e4d646
        continue_on_error: true
        action: media_player.volume_set
      - target:
          entity_id:
          - media_player.clock_radio_2
          - media_player.isla_s_speaker
          - media_player.kitchen_speaker
          - media_player.living_room_speaker
          - media_player.samuel_s_speaker_2
        data:
          media:
            media_content_id: media-source://media_source/local/Doorbell.m4a
            media_content_type: audio/mp4
            metadata: {}
        continue_on_error: true
        action: media_player.play_media
  mode: parallel
  max: 3
